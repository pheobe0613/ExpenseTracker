<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存錢目標</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#EAF2FF;
    --bg2:#F1EAFF;
    --bg3:#FFEFF5;
    --glass:rgba(255,255,255,0.50);
    --glass-strong:rgba(255,255,255,0.72);
    --glass-input:rgba(255,255,255,0.60);
    --glass-border:rgba(255,255,255,0.70);
    --hairline:rgba(31,39,51,0.09);
    --ink:#1F2733;
    --ink-soft:#4C5566;
    --ink-faint:#7C8698;
    --red:#D9564A;
    --green:#2E9E67;
    --brass:#BD8A3F;
    --navy:#3E6FD9;
    --teal:#1F9C92;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 10px 32px rgba(31,45,80,.14);
    --font-serif:'Source Serif 4','Noto Serif TC',serif;
    --font-sans:'Inter','PingFang TC','Microsoft JhengHei',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg1:#0C1220;
      --bg2:#181030;
      --bg3:#1B0F22;
      --glass:rgba(32,38,54,0.55);
      --glass-strong:rgba(32,38,54,0.76);
      --glass-input:rgba(32,38,54,0.55);
      --glass-border:rgba(255,255,255,0.12);
      --hairline:rgba(255,255,255,0.12);
      --ink:#EDEFF4;
      --ink-soft:#C4CAD6;
      --ink-faint:#8B93A3;
      --red:#F0897C;
      --green:#72D9A4;
      --brass:#E4BB7E;
      --navy:#8FB2FF;
      --teal:#7BE3D6;
      --shadow:0 10px 32px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg1:#0C1220;
    --bg2:#181030;
    --bg3:#1B0F22;
    --glass:rgba(32,38,54,0.55);
    --glass-strong:rgba(32,38,54,0.76);
    --glass-input:rgba(32,38,54,0.55);
    --glass-border:rgba(255,255,255,0.12);
    --hairline:rgba(255,255,255,0.12);
    --ink:#EDEFF4;
    --ink-soft:#C4CAD6;
    --ink-faint:#8B93A3;
    --red:#F0897C;
    --green:#72D9A4;
    --brass:#E4BB7E;
    --navy:#8FB2FF;
    --teal:#7BE3D6;
    --shadow:0 10px 32px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 10%, var(--bg1), transparent 55%),
      radial-gradient(circle at 88% 18%, var(--bg2), transparent 55%),
      radial-gradient(circle at 50% 95%, var(--bg3), transparent 60%),
      var(--bg1);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  a{color:inherit;}
  button{font:inherit;color:inherit;}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 100px;}

  /* ---------- Masthead ---------- */
  .masthead{
    background:linear-gradient(135deg, rgba(38,49,71,.72), rgba(63,86,133,.58));
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border:1px solid var(--glass-border);
    box-shadow:var(--shadow);
    color:#F3F5FA;
    border-radius:var(--radius);
    padding:22px 22px 20px;
    margin-bottom:14px;
  }
  .masthead-inner{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:14px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{font-size:28px;line-height:1;}
  .brand h1{
    font-family:var(--font-serif);
    font-size:21px;
    font-weight:600;
    margin:0 0 2px;
    letter-spacing:.2px;
  }
  .brand .tagline{margin:0;font-size:12.5px;color:rgba(243,245,250,.72);}
  .networth{text-align:right;}
  .networth-label{display:block;font-size:11.5px;color:rgba(243,245,250,.62);margin-bottom:2px;}
  .networth-value{
    font-family:var(--font-serif);
    font-size:30px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- Site nav ---------- */
  .site-links{display:flex;gap:8px;margin-bottom:16px;}
  .site-link{
    font-size:12.5px;font-weight:600;
    padding:6px 13px;border-radius:999px;
    background:var(--glass-input);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--glass-border);
    color:var(--ink-soft);
    text-decoration:none;
  }
  .site-link.active{background:var(--glass-strong);color:var(--ink);border-color:var(--ink);}

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    margin-bottom:16px;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .tabs::-webkit-scrollbar,
  .ledger-wrap::-webkit-scrollbar,
  .modal::-webkit-scrollbar{
    display:none;
    width:0;
    height:0;
  }
  .tab-btn{
    flex:0 0 auto;
    background:var(--glass);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--glass-border);
    border-bottom:3px solid var(--glass-border);
    color:var(--ink-soft);
    font-family:var(--font-sans);
    font-size:13.5px;
    font-weight:600;
    padding:8px 14px;
    border-radius:var(--radius-sm) var(--radius-sm) 0 0;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active{
    color:var(--ink);
    border-bottom-color:var(--teal);
    background:var(--glass-strong);
  }
  .tab-btn.add-tab{color:var(--navy); border-style:dashed;}
  .tab-btn:focus-visible{outline:2px solid var(--navy); outline-offset:1px;}

  /* ---------- Cards ---------- */
  .card{
    background:var(--glass);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-border);
    box-shadow:var(--shadow);
    border-radius:var(--radius);
    padding:16px;
  }
  .section-title{
    font-family:var(--font-serif);
    font-size:15px;
    font-weight:600;
    margin:0 0 10px;
  }
  .empty-state{
    text-align:center;
    padding:30px 10px;
    color:var(--ink-faint);
    font-size:13.5px;
  }

  /* ---------- Goal cards ---------- */
  .goal-card{
    background:var(--glass);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-border);
    box-shadow:var(--shadow);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    cursor:pointer;
    text-align:left;
    width:100%;
    display:block;
  }
  .goal-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .goal-name{font-family:var(--font-serif);font-size:16.5px;font-weight:600;}
  .goal-meta{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}
  .goal-pct{
    font-family:var(--font-serif);font-size:21px;font-weight:700;
    color:var(--navy);white-space:nowrap;
  }
  .goal-pct.done{color:var(--green);}
  .goal-bar-track{
    width:100%;height:10px;border-radius:999px;
    background:var(--glass-input);
    border:1px solid var(--glass-border);
    overflow:hidden;
    margin:12px 0 8px;
  }
  .goal-bar-fill{
    height:100%;border-radius:999px;
    background:linear-gradient(90deg, var(--navy), var(--teal));
  }
  .goal-bar-fill.done{background:linear-gradient(90deg, var(--green), var(--teal));}
  .goal-amounts{
    display:flex;justify-content:space-between;
    font-size:12.5px;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .goal-amounts .target{color:var(--ink-faint);}
  .goal-actions{display:flex;justify-content:flex-end;margin-top:10px;}
  .quick-deposit-btn{
    background:var(--glass-strong);
    border:1px solid var(--glass-border);
    border-radius:999px;
    color:var(--navy);
    font-size:12px;font-weight:600;
    padding:6px 13px;cursor:pointer;
  }
  .goal-badge{
    display:inline-flex;align-items:center;gap:4px;
    font-size:11px;padding:2px 9px;border-radius:999px;
    background:var(--glass-input);border:1px solid var(--glass-border);
    color:var(--green);margin-top:6px;
  }

  /* ---------- Goal detail header ---------- */
  .goal-header{margin-bottom:16px;}
  .goal-header h2{
    font-family:var(--font-serif);
    font-size:21px;margin:0 0 2px;
  }
  .goal-header .goal-meta{margin-bottom:12px;}
  .goal-header-card{
    background:var(--glass);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-border);
    box-shadow:var(--shadow);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:18px;
  }
  .goal-header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .goal-big-pct{
    font-family:var(--font-serif);font-size:30px;font-weight:700;
    color:var(--navy);
  }
  .goal-big-pct.done{color:var(--green);}
  .header-actions{display:flex;gap:6px;}
  .icon-btn{
    background:var(--glass-input);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-sm);
    color:var(--ink-soft);
    padding:6px 10px;font-size:12.5px;cursor:pointer;
    font-family:var(--font-sans);
  }
  .icon-btn:hover{border-color:var(--ink-soft);}
  .icon-btn.danger:hover{color:var(--red);border-color:var(--red);}

  /* ---------- Ledger table ---------- */
  .ledger-wrap{overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;}
  table.ledger{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
    min-width:420px;
  }
  table.ledger th{
    text-align:left;
    font-size:11px;
    color:var(--ink-faint);
    font-weight:600;
    padding:6px 8px;
    border-bottom:1px solid var(--hairline);
    white-space:nowrap;
  }
  table.ledger td{
    padding:9px 8px;
    border-bottom:1px solid var(--hairline);
    vertical-align:top;
  }
  table.ledger tr:last-child td{border-bottom:none;}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .num.out{color:var(--red);}
  .num.in{color:var(--green);}
  .num.bal{color:var(--ink-soft);}
  .memo-main{font-weight:600;}
  .memo-sub{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
  .row-del{
    background:none;border:none;color:var(--ink-faint);
    cursor:pointer;font-size:12px;padding:2px 4px;
  }
  .row-del:hover{color:var(--red);}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    right:20px;bottom:20px;
    width:56px;height:56px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--navy), #6D93E8);
    color:#FFFFFF;
    border:1px solid rgba(255,255,255,.5);
    font-size:26px;
    box-shadow:0 10px 26px rgba(62,111,217,.45);
    cursor:pointer;
    z-index:20;
  }
  .fab:focus-visible{outline:3px solid var(--navy);outline-offset:2px;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(20,26,38,.35);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:30;
  }
  .overlay.open{display:flex;}
  @media (min-width:600px){
    .overlay{align-items:center;}
  }
  .modal{
    background:var(--glass-strong);
    backdrop-filter:blur(26px);
    -webkit-backdrop-filter:blur(26px);
    border:1px solid var(--glass-border);
    box-shadow:var(--shadow);
    width:100%;
    max-width:440px;
    box-sizing:border-box;
    border-radius:var(--radius) var(--radius) 0 0;
    padding:20px;
    max-height:88vh;
    overflow-y:auto;
    overflow-x:hidden;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  @media (min-width:600px){
    .modal{border-radius:var(--radius);}
  }
  .modal h3{
    font-family:var(--font-serif);
    font-size:17px;margin:0 0 14px;
  }
  .seg{
    display:flex;
    background:var(--glass-input);
    border:1px solid var(--glass-border);
    border-radius:var(--radius-sm);
    overflow:hidden;
    margin-bottom:14px;
  }
  .seg button{
    flex:1;
    padding:9px 6px;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-family:var(--font-sans);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    border-right:1px solid var(--glass-border);
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--ink);color:#fff;}
  label{
    display:block;font-size:12px;color:var(--ink-soft);
    margin:12px 0 5px;
  }
  input[type=text],input[type=number],input[type=date]{
    width:100%;
    max-width:100%;
    min-width:0;
    padding:9px 10px;
    border:1px solid var(--glass-border);
    border-radius:var(--radius-sm);
    background:var(--glass-input);
    color:var(--ink);
    font-family:var(--font-sans);
    font-size:16px;
    box-sizing:border-box;
  }
  input[type=date]{
    -webkit-appearance:none;
    appearance:none;
  }
  input:focus-visible,button:focus-visible{
    outline:2px solid var(--navy);outline-offset:1px;
  }
  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .btn{
    flex:1;padding:11px;border-radius:var(--radius-sm);
    font-family:var(--font-sans);font-size:14px;font-weight:600;
    cursor:pointer;border:1px solid var(--glass-border);
    background:var(--glass-input);color:var(--ink-soft);
  }
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn.danger{color:var(--red);border-color:var(--red);}
  .field-error{color:var(--red);font-size:12px;margin-top:6px;display:none;}
  .field-hint{color:var(--ink-faint);font-size:11.5px;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <span class="brand-mark">🎯</span>
        <div>
          <h1>存錢目標</h1>
          <p class="tagline">設定目標金額，追蹤每一筆存款進度</p>
        </div>
      </div>
      <div class="networth">
        <span class="networth-label">已存 / 目標總額</span>
        <span class="networth-value" id="totalValue">NT$ 0</span>
      </div>
    </div>
  </header>

  <nav class="site-links">
    <a href="index.html" class="site-link">🧾 記帳本</a>
    <a href="goals.html" class="site-link active">🎯 存錢目標</a>
  </nav>

  <nav class="tabs" id="tabs"></nav>

  <main id="mainView"></main>

</div>

<button class="fab" id="fabAdd" title="新增" aria-label="新增">＋</button>

<!-- Goal modal -->
<div class="overlay" id="goalOverlay">
  <div class="modal">
    <h3 id="goalModalTitle">新增目標</h3>
    <label for="goalName">目標名稱</label>
    <input type="text" id="goalName" placeholder="例如：日本旅遊基金">
    <label for="goalTarget">目標金額</label>
    <input type="number" id="goalTarget" inputmode="numeric" pattern="[0-9]*" min="0" step="1" placeholder="0">
    <label for="goalStart">目前已有金額（選填）</label>
    <input type="number" id="goalStart" inputmode="numeric" pattern="[0-9]*" min="0" step="1" placeholder="0">
    <label for="goalDate">目標日期（選填）</label>
    <input type="date" id="goalDate">
    <p class="field-error" id="goalError">請輸入目標名稱與大於 0 的目標金額。</p>
    <div class="modal-actions">
      <button class="btn" id="goalCancel">取消</button>
      <button class="btn danger" id="goalDelete" style="display:none;">刪除</button>
      <button class="btn primary" id="goalSubmit">儲存</button>
    </div>
  </div>
</div>

<!-- Entry modal -->
<div class="overlay" id="entryOverlay">
  <div class="modal">
    <h3 id="entryModalTitle">新增紀錄</h3>
    <div class="seg" id="entryTypeSeg">
      <button type="button" data-type="deposit" class="active">存入</button>
      <button type="button" data-type="withdraw">提出</button>
    </div>
    <label for="entryDate">日期</label>
    <input type="date" id="entryDate">
    <label for="entryAmount">金額</label>
    <input type="number" id="entryAmount" inputmode="numeric" pattern="[0-9]*" min="0" step="1" placeholder="0">
    <label for="entryNote">備註（選填）</label>
    <input type="text" id="entryNote" placeholder="備註">
    <p class="field-error" id="entryError">請輸入大於 0 的金額。</p>
    <div class="modal-actions">
      <button class="btn" id="entryCancel">取消</button>
      <button class="btn primary" id="entrySubmit">儲存</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "savings-goals-app-v1";

  var state = loadState();
  var activeTab = "overview";
  var editingGoalId = null;

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.goals) && Array.isArray(parsed.entries)){
          return parsed;
        }
      }
    }catch(e){ /* fall through to default */ }
    return { goals: [], entries: [] };
  }

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ /* storage unavailable; app still works this session */ }
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function fmt(n){
    var v = Math.round(n || 0);
    var sign = v < 0 ? "-" : "";
    return sign + "NT$ " + Math.abs(v).toLocaleString("zh-Hant-TW");
  }

  function todayStr(){ return new Date().toISOString().slice(0,10); }

  function daysBetween(d1, d2){
    var t1 = new Date(d1 + "T00:00:00");
    var t2 = new Date(d2 + "T00:00:00");
    return Math.round((t2 - t1) / 86400000);
  }

  function getGoal(id){
    return state.goals.filter(function(g){ return g.id === id; })[0];
  }

  function goalSaved(goal){
    var total = goal.startingAmount || 0;
    state.entries.forEach(function(e){
      if(e.goalId !== goal.id) return;
      if(e.type === "deposit") total += e.amount;
      if(e.type === "withdraw") total -= e.amount;
    });
    return total;
  }

  function goalPct(goal){
    if(!goal.target) return 0;
    return (goalSaved(goal) / goal.target) * 100;
  }

  function totalSaved(){
    return state.goals.reduce(function(s,g){ return s + goalSaved(g); }, 0);
  }
  function totalTarget(){
    return state.goals.reduce(function(s,g){ return s + (g.target || 0); }, 0);
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function byDateDesc(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }
  function byDateAsc(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }

  // ---------- Rendering ----------

  function render(){
    document.getElementById("totalValue").textContent = fmt(totalSaved()) + " / " + fmt(totalTarget());
    renderTabs();
    if(activeTab === "overview"){
      renderOverview();
    } else {
      renderGoalView(activeTab);
    }
  }

  function renderTabs(){
    var tabs = document.getElementById("tabs");
    tabs.innerHTML = "";
    tabs.appendChild(makeTabBtn("overview", "總覽"));
    var addBtn = document.createElement("button");
    addBtn.className = "tab-btn add-tab";
    addBtn.textContent = "＋ 新增目標";
    addBtn.addEventListener("click", function(){ openGoalModal(null); });
    tabs.appendChild(addBtn);
  }

  function makeTabBtn(id, label){
    var btn = document.createElement("button");
    btn.className = "tab-btn" + (activeTab === id ? " active" : "");
    btn.textContent = label;
    btn.addEventListener("click", function(){ activeTab = id; render(); });
    return btn;
  }

  function goalMetaLine(goal){
    var parts = [];
    if(goal.targetDate){
      var days = daysBetween(todayStr(), goal.targetDate);
      if(days > 0) parts.push("目標日：" + goal.targetDate + "（還有 " + days + " 天）");
      else if(days === 0) parts.push("目標日：" + goal.targetDate + "（就是今天）");
      else parts.push("目標日：" + goal.targetDate + "（已過期 " + Math.abs(days) + " 天）");
    }
    return parts.join("　");
  }

  function renderOverview(){
    var main = document.getElementById("mainView");
    var html = "";

    if(state.goals.length === 0){
      html += '<div class="card empty-state">還沒有任何存錢目標，點右下角「＋」開始設定第一個目標。</div>';
    } else {
      state.goals.forEach(function(g){
        var saved = goalSaved(g);
        var pct = goalPct(g);
        var done = g.target > 0 && saved >= g.target;
        var barWidth = Math.max(0, Math.min(100, pct));
        html += '<button class="goal-card" data-goto="' + g.id + '">' +
          '<div class="goal-card-top">' +
            '<div>' +
              '<div class="goal-name">' + escapeHtml(g.name) + '</div>' +
              (goalMetaLine(g) ? '<div class="goal-meta">' + escapeHtml(goalMetaLine(g)) + '</div>' : '') +
            '</div>' +
            '<div class="goal-pct' + (done ? ' done' : '') + '">' + Math.round(pct) + '%</div>' +
          '</div>' +
          '<div class="goal-bar-track"><div class="goal-bar-fill' + (done ? ' done' : '') + '" style="width:' + barWidth + '%;"></div></div>' +
          '<div class="goal-amounts"><span>已存 ' + fmt(saved) + '</span><span class="target">目標 ' + fmt(g.target) + '</span></div>' +
          (done ? '<div class="goal-badge">🎉 已達成目標</div>' : '') +
          '<div class="goal-actions"><span class="quick-deposit-btn" data-quickdeposit="' + g.id + '">＋ 存入</span></div>' +
        '</button>';
      });
    }

    main.innerHTML = html;

    main.querySelectorAll("[data-goto]").forEach(function(el){
      el.addEventListener("click", function(){ activeTab = el.getAttribute("data-goto"); render(); });
    });
    main.querySelectorAll("[data-quickdeposit]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        openEntryModal(el.getAttribute("data-quickdeposit"), "deposit");
      });
    });
  }

  function renderGoalView(id){
    var goal = getGoal(id);
    if(!goal){ activeTab = "overview"; return renderOverview(); }
    var main = document.getElementById("mainView");
    var saved = goalSaved(goal);
    var pct = goalPct(goal);
    var done = goal.target > 0 && saved >= goal.target;
    var barWidth = Math.max(0, Math.min(100, pct));

    var html = '<div class="goal-header-card">' +
      '<div class="goal-header-top">' +
        '<div>' +
          '<h2>' + escapeHtml(goal.name) + '</h2>' +
          (goalMetaLine(goal) ? '<div class="goal-meta">' + escapeHtml(goalMetaLine(goal)) + '</div>' : '') +
        '</div>' +
        '<div class="header-actions">' +
          '<button class="icon-btn" id="editGoalBtn">編輯</button>' +
          '<button class="icon-btn danger" id="delGoalBtn">刪除</button>' +
        '</div>' +
      '</div>' +
      '<div class="goal-big-pct' + (done ? ' done' : '') + '">' + Math.round(pct) + '%</div>' +
      '<div class="goal-bar-track"><div class="goal-bar-fill' + (done ? ' done' : '') + '" style="width:' + barWidth + '%;"></div></div>' +
      '<div class="goal-amounts"><span>已存 ' + fmt(saved) + '</span><span class="target">目標 ' + fmt(goal.target) + '</span></div>' +
      (done ? '<div class="goal-badge">🎉 已達成目標</div>' : '') +
    '</div>';

    var entries = state.entries.filter(function(e){ return e.goalId === id; }).sort(byDateAsc);
    var running = goal.startingAmount || 0;
    var rows = entries.map(function(e){
      if(e.type === "deposit") running += e.amount;
      else running -= e.amount;
      var dateShort = e.date.slice(5).replace("-", "/");
      return '<tr>' +
        '<td>' + dateShort + '</td>' +
        '<td><div class="memo-main">' + (e.type === "deposit" ? "存入" : "提出") + '</div>' + (e.note ? '<div class="memo-sub">' + escapeHtml(e.note) + '</div>' : '') + '</td>' +
        '<td class="num out">' + (e.type === "withdraw" ? fmt(e.amount) : "") + '</td>' +
        '<td class="num in">' + (e.type === "deposit" ? fmt(e.amount) : "") + '</td>' +
        '<td class="num bal">' + fmt(running) + '</td>' +
        '<td><button class="row-del" data-delentry="' + e.id + '" title="刪除">✕</button></td>' +
      '</tr>';
    }).reverse();

    html += '<h2 class="section-title">存提紀錄</h2>';
    html += '<div class="card ledger-wrap">';
    if(rows.length === 0){
      html += '<div class="empty-state">這個目標還沒有任何存提紀錄。</div>';
    } else {
      html += '<table class="ledger"><thead><tr><th>日期</th><th>摘要</th><th class="num">提出</th><th class="num">存入</th><th class="num">累計</th><th></th></tr></thead><tbody>' + rows.join("") + '</tbody></table>';
    }
    html += '</div>';

    main.innerHTML = html;

    document.getElementById("editGoalBtn").addEventListener("click", function(){ openGoalModal(goal.id); });
    document.getElementById("delGoalBtn").addEventListener("click", function(){ deleteGoal(goal.id); });
    main.querySelectorAll("[data-delentry]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var eid = btn.getAttribute("data-delentry");
        if(confirm("確定要刪除這筆紀錄嗎？")){
          state.entries = state.entries.filter(function(e){ return e.id !== eid; });
          saveState();
          render();
        }
      });
    });
  }

  // ---------- Goal modal ----------

  var goalOverlay = document.getElementById("goalOverlay");

  function openGoalModal(id){
    editingGoalId = id;
    var isEdit = !!id;
    document.getElementById("goalModalTitle").textContent = isEdit ? "編輯目標" : "新增目標";
    document.getElementById("goalError").style.display = "none";
    document.getElementById("goalDelete").style.display = isEdit ? "block" : "none";
    if(isEdit){
      var g = getGoal(id);
      document.getElementById("goalName").value = g.name;
      document.getElementById("goalTarget").value = g.target;
      document.getElementById("goalStart").value = g.startingAmount || 0;
      document.getElementById("goalDate").value = g.targetDate || "";
    } else {
      document.getElementById("goalName").value = "";
      document.getElementById("goalTarget").value = "";
      document.getElementById("goalStart").value = "";
      document.getElementById("goalDate").value = "";
    }
    goalOverlay.classList.add("open");
  }
  function closeGoalModal(){ goalOverlay.classList.remove("open"); }

  document.getElementById("goalCancel").addEventListener("click", closeGoalModal);
  goalOverlay.addEventListener("click", function(e){ if(e.target === goalOverlay) closeGoalModal(); });

  document.getElementById("goalSubmit").addEventListener("click", function(){
    var name = document.getElementById("goalName").value.trim();
    var target = parseFloat(document.getElementById("goalTarget").value);
    var start = parseFloat(document.getElementById("goalStart").value) || 0;
    var date = document.getElementById("goalDate").value || null;
    var err = document.getElementById("goalError");
    if(!name || !target || target <= 0){
      err.style.display = "block";
      return;
    }
    if(editingGoalId){
      var g = getGoal(editingGoalId);
      g.name = name; g.target = target; g.startingAmount = start; g.targetDate = date;
    } else {
      state.goals.push({
        id: uid(), name: name, target: target, startingAmount: start,
        targetDate: date, createdDate: todayStr()
      });
    }
    saveState();
    closeGoalModal();
    render();
  });

  function deleteGoal(id){
    if(!confirm("確定要刪除這個目標嗎？相關的存提紀錄也會一併移除。")) return;
    state.goals = state.goals.filter(function(g){ return g.id !== id; });
    state.entries = state.entries.filter(function(e){ return e.goalId !== id; });
    saveState();
    activeTab = "overview";
    render();
  }

  document.getElementById("goalDelete").addEventListener("click", function(){
    if(!editingGoalId) return;
    closeGoalModal();
    deleteGoal(editingGoalId);
  });

  // ---------- Entry modal ----------

  var entryOverlay = document.getElementById("entryOverlay");
  var entryType = "deposit";
  var entryGoalId = null;

  function openEntryModal(goalId, presetType){
    entryGoalId = goalId;
    entryType = presetType || "deposit";
    document.getElementById("entryModalTitle").textContent = getGoal(goalId) ? getGoal(goalId).name : "新增紀錄";
    Array.prototype.forEach.call(document.getElementById("entryTypeSeg").children, function(b){
      b.classList.toggle("active", b.getAttribute("data-type") === entryType);
    });
    document.getElementById("entryDate").value = todayStr();
    document.getElementById("entryAmount").value = "";
    document.getElementById("entryNote").value = "";
    document.getElementById("entryError").style.display = "none";
    entryOverlay.classList.add("open");
  }
  function closeEntryModal(){ entryOverlay.classList.remove("open"); }

  document.getElementById("entryTypeSeg").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-type]");
    if(!btn) return;
    entryType = btn.getAttribute("data-type");
    Array.prototype.forEach.call(document.getElementById("entryTypeSeg").children, function(b){
      b.classList.toggle("active", b === btn);
    });
  });

  document.getElementById("entryCancel").addEventListener("click", closeEntryModal);
  entryOverlay.addEventListener("click", function(e){ if(e.target === entryOverlay) closeEntryModal(); });

  document.getElementById("entrySubmit").addEventListener("click", function(){
    var amount = parseFloat(document.getElementById("entryAmount").value);
    var date = document.getElementById("entryDate").value || todayStr();
    var note = document.getElementById("entryNote").value.trim();
    var err = document.getElementById("entryError");
    if(!amount || amount <= 0){
      err.style.display = "block";
      return;
    }
    if(!entryGoalId){ closeEntryModal(); return; }
    state.entries.push({
      id: uid(), goalId: entryGoalId, date: date, type: entryType, amount: amount, note: note
    });
    saveState();
    closeEntryModal();
    render();
  });

  document.getElementById("fabAdd").addEventListener("click", function(){
    if(activeTab === "overview"){
      if(state.goals.length === 0){ openGoalModal(null); return; }
      openEntryModal(state.goals[0].id, "deposit");
    } else {
      openEntryModal(activeTab, "deposit");
    }
  });

  render();
})();
</script>
</body>
</html>
